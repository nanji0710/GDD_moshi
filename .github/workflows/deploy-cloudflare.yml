name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release gate (fail fast)
        run: node tools/check-release.mjs prototype

      - name: Stage site (white-list + version.json)
        run: node tools/stage-site.mjs --out _site --commit "${GITHUB_SHA}" --branch "${GITHUB_REF_NAME}"

      - name: Deploy _site/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name last-train --branch main

      - name: Verify deployed version (retry up to 3 min)
        run: |
          for i in $(seq 1 12); do
            if node tools/verify-deploy.mjs --url https://last-train-87y.pages.dev --commit "${GITHUB_SHA}"; then exit 0; fi
            sleep 15
          done
          echo "线上版本与本次提交不一致，或部署目录带了测试工具" >&2
          exit 1
