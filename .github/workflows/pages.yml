name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage site (white-list + version.json)
        run: node tools/stage-site.mjs --out _site --commit "${GITHUB_SHA}" --branch "${GITHUB_REF_NAME}"

      - name: Upload _site as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed version (retry up to 3 min)
        run: |
          for i in $(seq 1 12); do
            if node tools/verify-deploy.mjs --url https://nanji0710.github.io/GDD_moshi --commit "${GITHUB_SHA}"; then exit 0; fi
            sleep 15
          done
          echo "线上版本与本次提交不一致，或部署目录带了测试工具" >&2
          exit 1
