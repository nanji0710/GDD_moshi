<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>404 · 末世列车</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 100% at 50% 0%, #1d232c 0%, #14161a 55%, #0e1013 100%);
      color: #e6ebf2; text-align: center; padding: 24px;
      font: 15px/1.7 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    .panel {
      width: min(520px, 100%); padding: 40px 28px 34px; border-radius: 14px;
      background: rgba(255, 255, 255, .035); border: 1px solid rgba(255, 255, 255, .09);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
    }
    .code { font: 600 64px/1 ui-monospace, Consolas, monospace; letter-spacing: .06em; color: #ffb347; }
    h1 { margin: 18px 0 8px; font-size: 20px; letter-spacing: .06em; font-weight: 600; }
    p { margin: 0 0 24px; color: #9aa7b6; font-size: 13px; }
    a {
      display: inline-block; padding: 11px 26px; border-radius: 999px; text-decoration: none;
      color: #14161a; background: #ffb347; font-weight: 700; letter-spacing: .04em;
    }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .hint { margin-top: 18px; color: #5d6875; font-size: 12px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="code" aria-hidden="true">404</div>
    <h1>这一站不存在</h1>
    <p>链接可能写错了，或者你追的这班车已经开走。</p>
    <a href="/">回到标题页</a>
    <div class="hint">末世列车 · The Last Train</div>
  </main>
</body>
</html>
