<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>末世列车</title>
  <meta name="description" content="列车推进 · 车厢编组 · 尸潮防御（GDD v1.2 实现）">
  <!-- 首屏关键样式内联：脚本还没跑起来就先有加载态，不让玩家看白屏 -->
  <style>
    #boot-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: #14161a; color: #e6ebf2; text-align: center;
      font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      transition: opacity .28s ease;
    }
    #boot-loading.hidden { opacity: 0; pointer-events: none; }
    #boot-loading i {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .18); border-top-color: #ffb347;
      animation: bootspin .8s linear infinite;
    }
    #boot-loading b { font-size: 18px; letter-spacing: .14em; font-weight: 600; }
    #boot-loading span { color: #9aa7b6; font-size: 12px; letter-spacing: .08em; }
    @keyframes bootspin { to { transform: rotate(360deg); } }
  </style>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/ui-realism.css">
</head>
<body>
  <div id="boot-loading" role="status" aria-live="polite">
    <i aria-hidden="true"></i>
    <b>末世列车</b>
    <span>正在载入…</span>
  </div>
  <canvas id="map"></canvas>
  <div id="ui"></div>
  <noscript>需要启用 JavaScript。</noscript>
  <!-- #7：启动层失败态（内联，必须在 22 个外部 script 之前）。任一 classic script 404/加载失败 →
       #boot-loading 立刻改成「加载失败：请确认文件完整」；另加 10s 兜底，避免永久转圈。
       不新增 js 文件（多一个请求，且它自己 404 就没人兜底了）。 -->
  <script>
  (function () {
    var el = document.getElementById('boot-loading');
    function fail() {
      if (window.__bootFailed) return;
      window.__bootFailed = true;
      if (!el) return;
      el.classList.remove('hidden');
      el.style.display = '';
      var i = el.querySelector('i'); if (i) i.style.display = 'none';
      var b = el.querySelector('b'); if (b && b.parentNode) b.parentNode.removeChild(b);
      var s = el.querySelector('span'); if (s) s.textContent = '加载失败：请确认文件完整';
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT' && t.src) fail();
    }, true);
    setTimeout(function () { if (el && !el.classList.contains('hidden')) fail(); }, 10000);
  })();
  </script>
  <script src="js/util.js"></script>
  <script src="js/art.js"></script>
  <script src="js/cfg.js"></script>
  <script src="js/world.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/lighting.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/meta.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/tips.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/train.js"></script>
  <script src="js/zombies.js"></script>
  <script src="js/state.js"></script>
  <script src="js/save.js"></script>
  <script src="js/mapscreen.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
